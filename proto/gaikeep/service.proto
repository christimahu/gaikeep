// Protocol buffer definition for the Gai Keep API.
//
// This file defines the gRPC service interface and message types for the
// Gai Keep application. It serves as the contract between the server and client,
// specifying the available RPCs, their parameters, and return values.
syntax = "proto3";

// Package name for the proto.
package gaikeep;

// Go package path for the generated code.
option go_package = "github.com/ChristiMahu/gaikeep/proto/gaikeep";

// GaiKeep service definition.
//
// This service provides methods to save, retrieve, and list entries.
// It forms the primary API for interacting with the Gai Keep system,
// allowing clients to store and access AI-generated content.
service GaiKeep {
  // SaveEntry saves a new entry and returns its ID.
  // This method stores the provided content as a new entry in the system,
  // generating a unique identifier and timestamp automatically.
  rpc SaveEntry(SaveEntryRequest) returns (SaveEntryResponse);
  
  // GetEntry retrieves an entry by ID.
  // This method looks up and returns a previously saved entry using its
  // unique identifier. Returns an error if the entry is not found.
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  
  // ListEntries lists all entries.
  // This method retrieves all entries stored in the system, returning
  // them as a collection. The entries are returned in no guaranteed order.
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
}

// Entry represents a saved piece of content.
//
// This message type is used in responses from GetEntry and ListEntries.
// It contains the stored content along with metadata such as the ID,
// creation timestamp, and optional tags.
message Entry {
  // Unique identifier for the entry.
  // This is a UUID generated by the server when the entry is saved.
  string id = 1;
  
  // The text content of the entry.
  // This contains the actual AI-generated content being stored.
  string content = 2;
  
  // Timestamp when the entry was created (RFC3339 format).
  // This is set by the server at the time of creation.
  string created_at = 3;
  
  // Optional tags for categorization.
  // These can be used to organize and filter entries.
  repeated string tags = 4;
}

// SaveEntryRequest is the request message for the SaveEntry method.
message SaveEntryRequest {
  // The text content to save.
  // This is the AI-generated content that will be stored as an entry.
  string content = 1;
}

// SaveEntryResponse is the response message for the SaveEntry method.
message SaveEntryResponse {
  // The ID of the saved entry.
  // This is a UUID generated by the server for the newly created entry.
  string id = 1;
}

// GetEntryRequest is the request message for the GetEntry method.
message GetEntryRequest {
  // The ID of the entry to retrieve.
  // This should be a UUID that was previously returned from SaveEntry.
  string id = 1;
}

// GetEntryResponse is the response message for the GetEntry method.
//
// This is the same as an Entry message.
message GetEntryResponse {
  // Unique identifier for the entry.
  string id = 1;
  
  // The text content of the entry.
  string content = 2;
  
  // Timestamp when the entry was created (RFC3339 format).
  string created_at = 3;
  
  // Optional tags for categorization.
  repeated string tags = 4;
}

// ListEntriesRequest is the request message for the ListEntries method.
//
// This is an empty message as no parameters are required.
message ListEntriesRequest {}

// ListEntriesResponse is the response message for the ListEntries method.
message ListEntriesResponse {
  // The list of entries.
  // This contains all entries stored in the system.
  repeated Entry entries = 1;
}
